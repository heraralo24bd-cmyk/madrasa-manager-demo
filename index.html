<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>মাদরাসা ম্যানেজার — ডেমো</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hind Siliguri","Noto Sans Bengali",sans-serif;background:linear-gradient(135deg,#0c2340,#1d4a73);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff}
.card{background:#fff;color:#243954;border-radius:24px;padding:40px 36px;max-width:520px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card img{width:84px;height:84px;border-radius:20px;margin-bottom:14px}
.card h1{font-size:26px;margin-bottom:4px}
.card .sub{color:#c9a227;font-weight:700;margin-bottom:18px}
.card p{color:#5b6b82;font-size:14.5px;line-height:1.8;margin-bottom:24px}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:15px 30px;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none;font-family:inherit;display:inline-flex;align-items:center;gap:10px}
.btn.m{background:linear-gradient(135deg,#1d4a73,#0c2340);color:#fff}
.btn.d{background:#eef3fb;color:#1d4a73;border:2px solid #dbe4f0}
.note{margin-top:22px;font-size:12.5px;color:#8a99ad}
</style>
</head>
<body>
<div class="card">
  <img src="app/assets/support-logo.png" alt="লোগো">
  <h1>মাদরাসা ম্যানেজার</h1>
  <div class="sub">লাইভ ডেমো</div>
  <p>সম্পূর্ণ সফটওয়্যারটি এখানে চালিয়ে দেখুন।<br>ডেমো মোডে কোনো তথ্য স্থায়ীভাবে সংরক্ষণ হয় না —<br>সেভ করার সাথে সাথে সব ডাটা মুছে যাবে।</p>
  <div class="btns">
    <a class="btn m" href="mobile.html">📱 মোবাইল ডেমো</a>
    <a class="btn d" href="desktop.html">🖥️ ডেস্কটপ ডেমো</a>
  </div>
  <div class="note">ডেমো — শুধু দেখার জন্য</div>
</div>
</body>
</html>
