<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>মোবাইল ডেমো — মাদরাসা ম্যানেজার</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hind Siliguri",sans-serif;background:linear-gradient(135deg,#0c2340,#1d4a73);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff}
.top{margin-bottom:16px;text-align:center}
.top a{color:#fde68a;text-decoration:none;font-size:14px}
.phone{width:414px;max-width:100%;height:min(880px,92vh);background:#000;border-radius:44px;padding:12px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.screen{width:100%;height:100%;border:0;border-radius:32px;background:#fff;display:block}
@media(max-width:480px){.phone{height:94vh;border-radius:24px;padding:6px}.screen{border-radius:18px}}
.hint{margin-top:12px;font-size:12.5px;color:#9db2cc}
</style>
</head>
<body>
<div class="top"><a href="index.html">← সব ডেমো</a></div>
<div class="phone"><iframe class="screen" src="app/index.html" title="মোবাইল ডেমো"></iframe></div>
<div class="hint">ডেমো মোড — সেভ করলে ডাটা মুছে যাবে</div>
</body>
</html>
